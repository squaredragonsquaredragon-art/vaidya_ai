services:
  db:
    image: postgres:15-alpine
    container_name: vaidya_db
    restart: always
    environment:
      POSTGRES_USER: vaidya_user
      POSTGRES_PASSWORD: vaidya_password
      POSTGRES_DB: vaidya_db
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaidya_user -d vaidya_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: vaidya_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - .:/app

volumes:
  postgres_data:
